name: Test

on:
  push:
    branches: [ cursor/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: genius-and-madman/package-lock.json
    
    - name: Install dependencies
      run: |
        cd genius-and-madman
        npm ci
    
    - name: Run unit tests
      run: |
        cd genius-and-madman
        npm test
    
    - name: Build
      run: |
        cd genius-and-madman
        npm run build
